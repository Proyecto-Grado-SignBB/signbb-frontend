# =============================================================================
# Override para el despliegue con Cloudflare Tunnel
# =============================================================================
# Uso, desde este directorio:
#   docker compose -f compose.prod.yaml -f compose.tunnel.yaml up -d --build
#
# Diferencias con compose.prod.yaml:
# - El host solo publica el puerto 80. Cloudflare termina el TLS.
# - Caddy usa Caddyfile.tunnel (hostnames propios) o Caddyfile.quick-tunnel
#   (un hostname aleatorio y ui-autoria bajo /autoria/).
#
# Selección del Caddyfile:
#   SIGNBB_TUNNEL_MODE=tunnel        (por defecto, requiere dominio)
#   SIGNBB_TUNNEL_MODE=quick-tunnel  (sin dominio; compilar autoría con
#                                     AUTORIA_BASE_HREF=/autoria/)
#
# Requiere Docker Compose que soporte el tag !override (v2.24.4 o superior).
# =============================================================================

services:
  web:
    ports: !override
      - "80:80"
    volumes:
      - ./Caddyfile.${SIGNBB_TUNNEL_MODE:-tunnel}:/etc/caddy/Caddyfile:ro
