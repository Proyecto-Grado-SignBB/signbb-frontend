<aside class="sidebar">
  <div class="brand-mark">
    <div class="dot"></div>
    <div><b>SignBB</b><span>Autoría clínica</span></div>
  </div>

  <a class="nav-item" [class.nav-item--activo]="seccionActiva === 'subgrafos'" routerLink="/subgrafos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7" rx="1.5" />
      <rect x="14" y="3" width="7" height="7" rx="1.5" />
      <rect x="3" y="14" width="7" height="7" rx="1.5" />
      <rect x="14" y="14" width="7" height="7" rx="1.5" />
    </svg>
    Subgrafos clínicos
  </a>
  <a class="nav-item" [class.nav-item--activo]="seccionActiva === 'reglas'" routerLink="/reglas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path
        d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M9 3v18M9 8h6M9 13h6" />
    </svg>
    Reglas de alarma
  </a>

  @if (esSupervisor()) {
    <a class="nav-item" [class.nav-item--activo]="seccionActiva === 'revision'" routerLink="/revision">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 4h6a2 2 0 0 1 2 2v14l-5-3-5 3V6a2 2 0 0 1 2-2Z" />
        <path d="m9.5 10 1.8 1.8 3.2-3.3" />
      </svg>
      Revisión
      @if (pendientes() > 0) {
        <span class="nav-badge">{{ pendientes() }}</span>
      }
    </a>
    <a class="nav-item" [class.nav-item--activo]="seccionActiva === 'personal'" routerLink="/personal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
      </svg>
      Personal
    </a>
  }

  <a class="sidebar-foot" [class.sidebar-foot--activo]="seccionActiva === 'perfil'" routerLink="/perfil" title="Mi perfil">
    <div class="avatar">{{ iniciales() }}</div>
    <div><b>{{ nombreMedico() }}</b><span>{{ institucion() }}</span></div>
  </a>
  <button type="button" class="salir" (click)="salir()">Cerrar sesión</button>
</aside>
