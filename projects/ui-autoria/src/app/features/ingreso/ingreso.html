<main class="ingreso">
  <form class="tarjeta" (ngSubmit)="ingresar()" novalidate>
    <div class="marca">
      <div class="dot"></div>
      <div><b>Canguritos</b><span>Autoría clínica</span></div>
    </div>

    <h1>Ingresa a tu cuenta</h1>
    <p class="ayuda">Usa el correo y la contraseña que te dio el supervisor.</p>

    <label class="campo">
      Correo
      <input maxlength="254" type="email" name="correo" autocomplete="username" placeholder="tu@correo.com"
             [(ngModel)]="correo" [disabled]="ingresando()" />
    </label>
    <label class="campo">
      Contraseña
      <input maxlength="72" type="password" name="contrasena" autocomplete="current-password" placeholder="Tu contraseña"
             [(ngModel)]="contrasena" [disabled]="ingresando()" />
    </label>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <app-boton [disabled]="ingresando()">{{ ingresando() ? 'Ingresando…' : 'Ingresar' }}</app-boton>
    <p class="pie">Las cuentas de médico las crea un supervisor.</p>
  </form>
</main>
