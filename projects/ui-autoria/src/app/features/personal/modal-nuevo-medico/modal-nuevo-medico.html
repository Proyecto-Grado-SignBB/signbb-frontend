<div class="backdrop" (click)="cerrar()">
  <div class="panel" role="dialog" aria-modal="true" aria-label="Agregar médico" (click)="$event.stopPropagation()">
    <div class="panel-head">
      <h3>Agregar médico</h3>
      <button type="button" class="btn-cerrar" title="Cerrar" [disabled]="guardando" (click)="cerrar()">✕</button>
    </div>

    <form class="panel-body" (ngSubmit)="enviar()">
      <p class="texto-modal">La cuenta se crea como <b>Médico</b> y podrá ingresar con la contraseña inicial.</p>

      <label class="campo">
        <span>Nombre completo</span>
        <input maxlength="100" type="text" name="nombre" [(ngModel)]="nombre" (blur)="tocadoNombre = true"
          placeholder="Ej: Dra. Valentina Herrera" [class.invalido]="faltaNombre" />
        @if (faltaNombre) {
          <small class="falta">Escribe el nombre del médico.</small>
        }
      </label>

      <label class="campo">
        <span>Correo</span>
        <input maxlength="254" type="email" name="correo" [(ngModel)]="correo" (blur)="tocadoCorreo = true"
          placeholder="nombre@institucion.org" [class.invalido]="faltaCorreo" />
        @if (faltaCorreo) {
          <small class="falta">Escribe un correo válido.</small>
        }
      </label>

      <label class="campo">
        <span>Institución</span>
        <input maxlength="150" type="text" name="institucion" [(ngModel)]="institucion"
          placeholder="Ej: Fundación Canguro" />
        <small>Opcional.</small>
      </label>

      <label class="campo">
        <span>Contraseña inicial</span>
        <input maxlength="72" type="password" name="contrasena" [(ngModel)]="contrasena" (blur)="tocadoContrasena = true"
          placeholder="Mínimo 8 caracteres" [class.invalido]="faltaContrasena" />
        <small>El médico usará esta contraseña para ingresar por primera vez.</small>
        @if (faltaContrasena) {
          <small class="falta">La contraseña debe tener al menos 8 caracteres.</small>
        }
      </label>

      @if (error) {
        <div class="error-modal" role="alert">{{ error }}</div>
      }
      <button type="submit" hidden></button>
    </form>

    <div class="panel-foot">
      <app-boton tono="neutro" variante="texto" alto="compacto" ancho="auto" [disabled]="guardando" (click)="cerrar()">Cancelar</app-boton>
      <app-boton tono="marca" alto="compacto" ancho="auto" [disabled]="guardando || !puedeCrear" (click)="enviar()">
        {{ guardando ? 'Creando…' : 'Crear médico' }}
      </app-boton>
    </div>
  </div>
</div>
